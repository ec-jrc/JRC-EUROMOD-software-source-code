[build-system]
requires = ["setuptools>=64",  "wheel"]
build-backend = "setuptools.build_meta"

[pip.conf]
no-build-isolation = true

[project]
name = "euromod"
version = "0.3.2"


requires-python = ">=3.8"
authors = [  
    {name = "Irina Belousova", email = "iri.belousova@gmail.com"},
    {name = "Hannes Serruys", email = "hannes.serruys@ec.europa.eu"},
    
        ]
maintainers = [
   {name = "Hannes Serruys", email = "hannes.serruys@ec.europa.eu"},
            ]
description = "Run the microsimulation model EUROMOD. The latest model and software versions of EUROMOD are available at https://euromod-web.jrc.ec.europa.eu/download-euromod ."
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["Euromod", "Microsimulation"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
            ]
dependencies = [ 
  "pandas", 
  "pythonnet", 
  "numpy",
  "polars",
            ]
            

[project.urls]
Documentation = "https://ec-jrc.github.io/JRC-EUROMOD-software-source-code/"
GitHub = "https://github.com/ec-jrc/JRC-EUROMOD-software-source-code"
Issues = "https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues"
EUROMOD = "https://euromod-web.jrc.ec.europa.eu/"

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
markers = [
    "live: tests requiring a locally installed EUROMOD model (EUROMOD_MODEL_PATH)",
]



[tool.setuptools.packages.find]
namespaces = false
where = ["src"]
include = ["euromod*"]


