[project]
name = "euromod-linking"
version = "0.3.0"
description = "Link external economic models to EUROMOD by transforming input microdata and run parameters"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE.txt"]
authors = [{ name = "Hannes Serruys", email = "hannes.serruys@ec.europa.eu" }]
keywords = ["EUROMOD", "microsimulation", "macro-micro linking", "tax-benefit", "microdata"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "euromod>=0.3.1",
    "pandas>=2.0",
    "numpy",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Mapping specs that read spreadsheets (.xlsx/.xlsm via openpyxl, .xls via xlrd).
excel = ["openpyxl>=3.1", "xlrd>=2.0.1"]
dev = ["pytest>=8", "openpyxl>=3.1", "xlrd>=2.0.1"]

[project.urls]
Documentation = "https://ec-jrc.github.io/JRC-EUROMOD-software-source-code/python-linking/"
Source = "https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/tree/master/connectors/PythonLinking"
"EUROMOD model" = "https://euromod-web.jrc.ec.europa.eu/download-euromod"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["euromod_linking*"]
namespaces = false

# setuptools warns "Package would be ignored" for euromod_linking.schemas and
# .mappings on every build. It is benign and there is no clean way to silence it:
# they are data directories, not packages — resources.py reads them as
# `resources.files("euromod_linking") / "mappings/x.yaml"`, i.e. as data of the
# parent — and `exclude` here does not suppress the check, because find_packages
# never discovered them in the first place. Giving them __init__.py to quiet it
# would move them out of the parent's package-data globs below, which is how the
# files would actually go missing. release_script.ps1 verifies the built
# artifacts instead of trusting either the config or the warning.

# These ship by two independent routes: this table, and MANIFEST.in combined with
# include_package_data, which setuptools defaults to true for pyproject config.
# Deleting either one on its own therefore changes nothing and looks safe — which
# is why release_script.ps1 checks the built artifacts against src/ rather than
# reasoning about this configuration.
[tool.setuptools.package-data]
"euromod_linking" = ["schemas/*.json", "mappings/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests requiring a locally configured EUROMOD model (EUROMOD_MODEL_PATH)",
]
