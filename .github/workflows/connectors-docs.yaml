# Build and deploy the Python connector documentation to GitHub Pages.
#
# One repository gets one Pages site, and two packages are documented here, so
# both are built into a single artifact:
#
#     /                  euromod          (the connector)
#     /python-linking/   euromod-linking  (macro-to-micro linking)
#
# The connector stays at the root so the URLs published since January keep
# working.
#
# Every released minor version of each package is built, from its own source
# at its release tag, plus the branch tip as "dev":
#
#     /0.3/  /0.2/  /dev/                          euromod
#     /python-linking/0.3/  /0.2/  /0.1/  /dev/    euromod-linking
#
# with the latest release also copied to each package's root, and a switcher
# injected into every page. Releases are the tags python_connector_v<x.y.z>
# and python_linking_v<x.y.z> on this repository, created on the sync commit
# that carried the release across. Pushing such a tag is what publishes a
# version; pushing to master rebuilds everything, including "dev". See
# .github/scripts/build_versioned_docs.py for the layout and the reasoning.
#
# Each package is built in its own virtualenv. They disagree about dependencies
# on purpose: the connector installs euromod and pythonnet, while euromod-linking
# installs with --no-deps precisely to keep .NET off the runner (importing it is
# .NET-free — its euromod import is lazy). Sharing one environment would let one
# package's install decide what the other documents.
name: Build and Deploy Connector Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'connectors/PythonIntegration/docs/**'
      - 'connectors/PythonIntegration/src/**'
      - 'connectors/PythonLinking/docs/**'
      - 'connectors/PythonLinking/src/**'
      - '.github/workflows/connectors-docs.yaml'
      - '.github/scripts/**'
    tags:
      - 'python_connector_v*'
      - 'python_linking_v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every release tag is built, so the checkout needs the whole history
      # and the tags, not the default single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The build script keeps every doctree cache in a temporary directory,
      # so nothing but HTML reaches the artifact.
      - name: Build euromod connector docs, every released minor (site root)
        run: |
          python -m venv .venv-connector
          .venv-connector/bin/pip install --quiet --upgrade pip
          .venv-connector/bin/pip install --quiet -r connectors/PythonIntegration/docs/requirements.txt
          python .github/scripts/build_versioned_docs.py \
            --python .venv-connector/bin/python \
            --tag-prefix python_connector_v \
            --package connectors/PythonIntegration \
            --out site

      # Built after the connector, into the connector's root: the script skips
      # a nested site that has its own versions.json, so order does not matter
      # for the switcher — but the connector's build starts by clearing its
      # output directory, so it has to go first.
      - name: Build euromod-linking docs, every released minor (site/python-linking)
        run: |
          python -m venv .venv-linking
          .venv-linking/bin/pip install --quiet --upgrade pip
          .venv-linking/bin/pip install --quiet -r connectors/PythonLinking/docs/requirements.txt
          python .github/scripts/build_versioned_docs.py \
            --python .venv-linking/bin/python \
            --tag-prefix python_linking_v \
            --package connectors/PythonLinking \
            --no-deps --nitpicky \
            --out site/python-linking

      - name: Check both sites were produced, versioned
        run: |
          for root in site site/python-linking; do
            test -f "$root/index.html"          || { echo "$root: front page missing"; exit 1; }
            test -f "$root/versions.json"       || { echo "$root: versions.json missing"; exit 1; }
            test -f "$root/dev/index.html"      || { echo "$root: dev build missing"; exit 1; }
            test -f "$root/_versions/switcher.js" || { echo "$root: switcher missing"; exit 1; }
            python - "$root" <<'PY'
          import json, os, sys
          root = sys.argv[1]
          for v in json.load(open(os.path.join(root, "versions.json"))):
              page = os.path.join(root, v["path"], "index.html")
              assert os.path.isfile(page), f"{root}: {v['name']} listed but {page} missing"
          print(root + ":", ", ".join(v["name"] for v in json.load(open(os.path.join(root, "versions.json")))))
          PY
          done
          if find site -name .doctrees -o -name environment.pickle | grep -q .; then
            echo "doctrees leaked into the artifact"; exit 1
          fi
          du -sh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
