# Build and deploy the Python connector documentation to GitHub Pages.
#
# One repository gets one Pages site, and two packages are documented here, so
# both are built into a single artifact:
#
#     /                  euromod          (the connector)
#     /python-linking/   euromod-linking  (macro-to-micro linking)
#
# The connector stays at the root so the URLs published since January keep
# working.
#
# Each package is built in its own virtualenv. They disagree about dependencies
# on purpose: the connector installs euromod and pythonnet, while euromod-linking
# installs with --no-deps precisely to keep .NET off the runner (importing it is
# .NET-free — its euromod import is lazy). Sharing one environment would let one
# package's install decide what the other documents.
name: Build and Deploy Connector Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'connectors/PythonIntegration/docs/**'
      - 'connectors/PythonIntegration/src/**'
      - 'connectors/PythonLinking/docs/**'
      - 'connectors/PythonLinking/src/**'
      - '.github/workflows/connectors-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -d keeps the doctree cache out of the published tree. Without it every
      # deployment also serves .doctrees/ and its environment.pickle, which is
      # most of the artifact's size and none of its content.
      - name: Build euromod connector docs (site root)
        run: |
          python -m venv .venv-connector
          .venv-connector/bin/pip install --quiet --upgrade pip
          .venv-connector/bin/pip install --quiet -r connectors/PythonIntegration/docs/requirements.txt
          .venv-connector/bin/pip install --quiet -e connectors/PythonIntegration
          .venv-connector/bin/sphinx-build -b html \
            -d "${RUNNER_TEMP}/doctrees-connector" \
            -D nb_execution_mode=off \
            connectors/PythonIntegration/docs site

      - name: Build euromod-linking docs (site/python-linking)
        run: |
          python -m venv .venv-linking
          .venv-linking/bin/pip install --quiet --upgrade pip
          .venv-linking/bin/pip install --quiet -r connectors/PythonLinking/docs/requirements.txt
          .venv-linking/bin/pip install --quiet -e connectors/PythonLinking --no-deps
          .venv-linking/bin/sphinx-build -b html -n \
            -d "${RUNNER_TEMP}/doctrees-linking" \
            connectors/PythonLinking/docs site/python-linking

      - name: Check both sites were produced
        run: |
          test -f site/index.html || { echo "connector docs missing"; exit 1; }
          test -f site/python-linking/index.html || { echo "linking docs missing"; exit 1; }
          test ! -d site/.doctrees || { echo "doctrees leaked into the artifact"; exit 1; }
          du -sh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
