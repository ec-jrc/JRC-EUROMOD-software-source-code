name: Build and Deploy Python Integration Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'connectors/PythonIntegration/docs/**'
      - 'connectors/PythonIntegration/src/**'
      - '.github/workflows/python-integration-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/PythonIntegration
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e .
      
      - name: Build documentation (no notebook execution)
        run: |
          cd docs
          sphinx-build -b html -D nb_execution_mode=off . _build/html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: connectors/PythonIntegration/docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4